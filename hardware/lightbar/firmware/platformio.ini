; LayerHound LED status light firmware (see ../README.md). Two shapes, same code:
;   ring  12-LED NeoPixel Ring, the main LayerHound light (default)
;   bar   8-LED NeoPixel Stick
; Build and load:  pio run -e ring -t upload   (or -e bar)      Watch its log:  pio device monitor
[platformio]
default_envs = ring

[env]
platform = espressif32@6.9.0
board = esp32dev            ; ESP32-WROOM-32, the 38-pin "narrow" boards in the parts list
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17

[env:ring]
build_flags = -DLEDS=12 '-DLAYOUT="ring"'

[env:bar]
build_flags = -DLEDS=8 '-DLAYOUT="bar"'
