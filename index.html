    <title>LayerHound</title>
    <script>
      // Apply the light theme before the page draws, so it doesn't flash dark first
      try { var t = localStorage.getItem('lh-theme'); if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('lh-light'); } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  </head>

  </body>
