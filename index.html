<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b12" />
    <title>LayerHound</title>
    <script>
      // Apply this device's theme (and wall screen) before the page draws, so it doesn't flash the default first
      try {
        var t = localStorage.getItem('lh-theme'), r = document.documentElement;
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') r.classList.add('lh-light');
        if (t) r.dataset.pack = t;
        if (localStorage.getItem('lh-wall') === '1' || /[?&]wall=1/.test(location.search)) r.classList.add('lh-wall');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
